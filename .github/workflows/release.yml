# Every push to main builds, tests and publishes a new Ecoar release with the friends' zip.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build, test and package
        shell: pwsh
        run: ./package.ps1 -SkipDesktopTests

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          $notes = git log -1 --pretty=%B
          gh release create $tag dist/Ecoar-amigos.zip --title "Ecoar $tag" --notes "$notes" --latest
